set / system
set / system name host-name R10-CE2
set / interface system0
set / interface system0 admin-state enable
set / interface system0 subinterface 0
set / interface system0 subinterface 0 admin-state enable
set / interface system0 subinterface 0 ipv4
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.10.10.10/32
set / network-instance default
set / network-instance default admin-state enable
set / network-instance default interface system0.0
set / interface ethernet-1/2
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 vlan-tagging true
set / interface ethernet-1/2 subinterface 10
set / interface ethernet-1/2 subinterface 10 admin-state enable
set / interface ethernet-1/2 subinterface 10 vlan encap single-tagged
set / interface ethernet-1/2 subinterface 10 vlan encap single-tagged vlan-id 10
set / interface ethernet-1/2 subinterface 10 ipv4
set / interface ethernet-1/2 subinterface 10 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 10 ipv4 address 192.168.1.2/24
set / network-instance default interface ethernet-1/2.10
