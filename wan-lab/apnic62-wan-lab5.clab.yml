name: apnic62-wan-lab5

topology:
  defaults:
    kind: nokia_srlinux

  kinds:
    nokia_srlinux:
      type: ixr-x1b
      image: ghcr.io/nokia/srlinux:25.10
      license: ../srl-license/srlinux.license
      startup-config: configs/lab5-start/__clabNodeName__.cfg

  nodes:
    r1-p1:
    r2-p2:
    r3-p3:
    r4-p4:
    r5-pe1:
    r6-pe2:
    r7-pe3:
    r8-pe4:
    r9-ce1:
    r10-ce2:
    r11-ce3:
    r12-ce4:

  links:
    - endpoints: ["r1-p1:e1-1", "r2-p2:e1-1"]
    - endpoints: ["r1-p1:e1-2", "r3-p3:e1-1"]
    - endpoints: ["r1-p1:e1-3", "r4-p4:e1-1"]
    - endpoints: ["r1-p1:e1-4", "r5-pe1:e1-1"]
    - endpoints: ["r1-p1:e1-5", "r6-pe2:e1-1"]
    - endpoints: ["r2-p2:e1-2", "r3-p3:e1-2"]
    - endpoints: ["r2-p2:e1-3", "r4-p4:e1-2"]
    - endpoints: ["r2-p2:e1-4", "r5-pe1:e1-2"]
    - endpoints: ["r2-p2:e1-5", "r6-pe2:e1-2"]
    - endpoints: ["r2-p2:e1-6", "r8-pe4:e1-1"]
    - endpoints: ["r3-p3:e1-3", "r4-p4:e1-3"]
    - endpoints: ["r3-p3:e1-5", "r6-pe2:e1-3"]
    - endpoints: ["r3-p3:e1-6", "r7-pe3:e1-1"]
    - endpoints: ["r4-p4:e1-6", "r7-pe3:e1-2"]
    - endpoints: ["r4-p4:e1-7", "r8-pe4:e1-2"]
    - endpoints: ["r5-pe1:e1-5", "r9-ce1:e1-1"]
    - endpoints: ["r6-pe2:e1-5", "r10-ce2:e1-1"]
    - endpoints: ["r7-pe3:e1-3", "r9-ce1:e1-2"]
    - endpoints: ["r8-pe4:e1-6", "r12-ce4:e1-1"]
